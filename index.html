  <h1 id="my-text">I love netham al tayebat</h1>

<button type="button" onclick="readText()">🔊 Read Aloud</button>

<script>
  function readText() {
    // Get the text from the element
    const text = document.getElementById("my-text").innerText;

    // Create a new SpeechSynthesisUtterance object
    const utterance = new SpeechSynthesisUtterance(text);

    // Optional: Set voice language (e.g., 'en-US')
    utterance.lang = "en-US";

    // Cancel any ongoing speech and speak the text
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }
</script>
